apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-v1
  namespace: default
  labels:
    app: dashboard
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
      version: v1
  template:
    metadata:
      labels:
        app: dashboard
        version: v1
    spec:
      serviceAccountName: dashboard-sa
      containers:
      - name: dashboard
        image: sacumesh/task-dashboard:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: MANAGER_API_URL
          value: "http://manager:8080/api/"