---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: manager
  namespace: default
  labels:
    app: manager
    managed-by: istio
spec:
  host: manager
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 100
    outlierDetection:
      consecutiveErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
