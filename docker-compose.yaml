version: "3.9"

services:
  mariadb:
    image: mariadb:10.6
    container_name: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${DATABASE_NAME:-tasks}
      MARIADB_USER: ${DATABASE_USER:-user}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:-test}
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped

  manager:
    image: sacumesh/task-manager:1.0.0
    container_name: manager
    environment:
      SERVER_PORT: ${MANAGER_PORT:-8080}
      DATASOURCE_URL: ${DATASOURCE_URL:-jdbc:mariadb://mariadb:3306}
      DATABASE_NAME: ${DATABASE_NAME:-tasks}
      DATABASE_USER: ${DATABASE_USER:-user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-test}
    ports:
      - "${MANAGER_PORT:-8080}:${MANAGER_PORT:-8080}"
    depends_on:
      - mariadb
    restart: unless-stopped

  dashboard:
    image: sacumesh/task-dashboard:1.0.0
    container_name: dashboard
    environment:
      SERVER_PORT: ${DASHBOARD_PORT:-5000}
      MANAGER_API_URL: http://manager:${MANAGER_PORT:-8080}/api/
    ports:
      - "${DASHBOARD_PORT:-5000}:${DASHBOARD_PORT:-5000}"
    depends_on:
      - manager
    restart: unless-stopped

volumes:
  mariadb_data: { }

