version: "3.9"

services:
  mariadb:
    image: mariadb:10.6
    container_name: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${DATABASE_NAME:-tasks}
      MARIADB_USER: ${DATABASE_USER:-user}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:-test}
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped

  task-manager:
    image: sacumesh/task-manager:1.0.0
    container_name: task-manager
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DATASOURCE_URL: jdbc:mariadb://mariadb:3306/${DATABASE_NAME:-tasks}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DATABASE_USER: ${DATABASE_USER:-user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-test}
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    depends_on:
      - mariadb
    restart: unless-stopped

  task-dashboard:
    image: sacumesh/task-dashboard:1.0.0
    container_name: task-dashboard
    environment:
      SERVER_PORT: ${TASK_DASHBOARD_PORT:-5000}
      TASK_MANAGER_API_URL: http://task-manager:${TASK_MANAGER_PORT:-8080}/api/
    ports:
      - "${TASK_DASHBOARD_PORT:-5000}:${TASK_DASHBOARD_PORT:-5000}"
    depends_on:
      - task-manager
    restart: unless-stopped

volumes:
  mariadb_data: { }

