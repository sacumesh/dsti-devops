---
- name: Download Minikube binary to temporary location
  get_url:
    url: "{{ minikube_url }}"
    dest: "{{ minikube_tmp }}"
    mode: '0755'
  become: true
  register: download_result

- name: Fail if Minikube download failed
  fail:
    msg: "Failed to download Minikube from {{ minikube_url }}"
  when: download_result is failed


- name: Install Minikube to /usr/local/bin
  command: "install -m 0755 {{ minikube_tmp }} {{ minikube_dest }}"
  args:
    creates: "{{ minikube_dest }}"
  become: true
  register: install_result


- name: Remove temporary Minikube binary
  file:
    path: "{{ minikube_tmp }}"
    state: absent
  become: true

# Option 1: Run synchronously in a shell that has the docker group (uses sg)
- name: Start Minikube as vagrant in docker-group shell
  become: true
  become_user: vagrant
  shell: sg docker -c 'HOME=/home/vagrant minikube start --driver=none'
  args:
    executable: /bin/bash
  register: minikube_start
  failed_when: minikube_start.rc != 0 and "'already running' not in minikube_start.stderr"

- name: Show minikube stdout
  debug:
    var: minikube_start.stdout_lines

- name: Show minikube stderr
  debug:
    var: minikube_start.stderr_lines
    