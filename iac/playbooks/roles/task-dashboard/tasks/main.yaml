# -----------------------------
# Ensure the application user exists
# -----------------------------
- name: Ensure springboot user exists
  user:
    name: "{{ app_user }}"
    shell: /bin/bash
    create_home: yes

- name: Ensure application directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  loop:
    - "{{ app_home }}"
    - "/var/log/{{ app_user }}"

# -----------------------------
# Install system dependencies (root)
# -----------------------------
- name: Install required packages 
  apt:
    name:
      - openjdk-17-jdk
      - maven
      - git
    state: present
    update_cache: yes

# -----------------------------
# Install system dependencies as root
# -----------------------------
- name: Update apt cache and install dependencies (root)
  apt:
    name: "{{ item }}"
    state: present
    update_cache: yes
  loop:
    - wget
    - bzip2
    - git
    - build-essential
    - curl

# -----------------------------
# Install Miniconda as root
# -----------------------------
- name: Download Miniconda installer (root)
  get_url:
    url: https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
    dest: /tmp/miniconda.sh
    mode: '0755'

- name: Install Miniconda (root)
  command: bash /tmp/miniconda.sh -b -p "{{ conda_path }}"
  args:
    creates: "{{ conda_path }}/bin/conda"
  become: yes

# -----------------------------
# Clone repository as root
# -----------------------------
- name: Determine repo name from URL
  set_fact:
    repo_name: "{{ repo_url | basename | regex_replace('\\.git$', '') }}"

- name: Clone the repository (root)
  git:
    repo: "{{ repo_url }}"
    dest: "{{ app_home }}/{{ repo_name }}"
    version: main
    force: yes
    update: yes
  become: yes

# -----------------------------
# Accept Conda ToS and create environment as root
# -----------------------------
- name: Accept Conda ToS for main channel (root)
  command: "{{ conda_path }}/bin/conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main"
  become: yes

- name: Accept Conda ToS for R channel (root)
  command: "{{ conda_path }}/bin/conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r"
  become: yes

- name: Create Conda environment for the app (root)
  command: "{{ conda_path }}/bin/conda create -y -p {{ app_home }}/{{ repo_name }}/conda_env python={{ python_version }}"
  args:
    creates: "{{ app_home }}/{{ repo_name }}/conda_env"
  become: yes

- name: Install Python dependencies in Conda environment (root)
  command: "{{ conda_path }}/bin/conda run -p {{ app_home }}/{{ repo_name }}/conda_env pip install -r {{ app_home }}/{{ repo_name }}/requirements.txt"
  become: yes

# -----------------------------
# Fix ownership of runtime directories
# -----------------------------
- name: Set ownership of runtime directories to app user
  file:
    path: "{{ item }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    recurse: yes
  loop:
    - "{{ app_home }}/{{ repo_name }}/conda_env"
    - "/var/log/{{ app_user }}"
    - "{{ app_home }}/{{ repo_name }}"


# -----------------------------
# Copy start.sh wrapper
# -----------------------------
- name: Copy start.sh wrapper
  copy:
    dest: "{{ app_home }}/{{ repo_name }}/start.sh"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
    content: |
      #!/bin/bash
      set -e

      APP_DIR="{{ app_home }}/{{ repo_name }}"
      CONDA_ENV="$APP_DIR/conda_env"
      HEALTH_URL="http://127.0.0.1:{{ task_dashboard_port }}/health"

      source {{ conda_path }}/bin/activate "$CONDA_ENV"

      python "$APP_DIR/src/main.py" &
      APP_PID=$!

      echo "Waiting for health endpoint..."
      for i in {1..30}; do
          if curl -sf "$HEALTH_URL" > /dev/null; then
              echo "Application is healthy"
              systemd-notify --ready
              break
          fi
          sleep 2
      done

      if ! kill -0 $APP_PID 2>/dev/null; then
          echo "Application exited prematurely"
          exit 1
      fi

      wait $APP_PID

# -----------------------------
# Create systemd service to run app as app user
# -----------------------------
- name: Create systemd service for Python frontend
  copy:
    dest: "/etc/systemd/system/{{ app_name }}.service"
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Python Frontend Dashboard Service
      After=network.target docker.service
      Wants=docker.service

      [Service]
      Type=notify
      User={{ app_user }}
      Group={{ app_group }}
      WorkingDirectory={{ app_home }}/{{ repo_name }}
      Environment="SERVER_PORT={{ task_dashboard_port }}"
      Environment="MANAGER_PORT={{ task_manager_port }}"
      Environment="MANAGER_HOST={{ task_manager_host }}"
      Environment="DATABASE_PASSWORD={{ database_password }}"
      ExecStart={{ app_home }}/{{ repo_name }}/start.sh
      Restart=always
      RestartSec=10
      NotifyAccess=all
      StandardOutput=syslog
      StandardError=syslog
      SyslogIdentifier={{ app_name }}

      [Install]
      WantedBy=multi-user.target

# -----------------------------
# Reload systemd and start service
# -----------------------------
- name: Reload systemd daemon
  systemd:
    daemon_reload: yes

- name: Enable and start Python frontend service
  systemd:
    name: "{{ app_name }}"
    enabled: yes
    state: started
