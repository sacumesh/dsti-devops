apiVersion: v1
kind: Namespace
metadata:
  name: task-manager

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
  namespace: task-manager
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi  # Adjust based on your storage requirements

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: task-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
      - name: mariadb
        image: mariadb:latest
        env:
        - name: MARIADB_DATABASE
          value: "test"  # Replace with your database name
        - name: MARIADB_USER
          value: "test"        # Replace with your database username
        - name: MARIADB_PASSWORD
          value: "test"        # Replace with your database password
        - name: MARIADB_ROOT_PASSWORD
          value: "test"   # Replace with your root password
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mariadb-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mariadb-storage
        persistentVolumeClaim:
          claimName: mariadb-pvc

---

apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: task-manager
spec:
  type: ClusterIP
  ports:
  - port: 3306
    targetPort: 3306
  selector:
    app: mariadb

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: task-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: sacumesh/task-manager:latest  # Your backend image
        env:
        - name: DATASOURCE_URL
          value: "jdbc:mariadb://mariadb:3306"
        - name: DB_NAME
          value: "test"  #  # Adjust with your DB name
        - name: DB_USERNAME
          value: "test"  # Replace with your database username
        - name: DB_PASSWORD
          value: "test"  # Replace with your database password
        ports:
        - containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: task-manager
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: backend

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: task-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: sacumesh/task-dashboard:latest  # Your frontend image
        env:
        - name: API_BASE_URL
          value: "http://backend:8080/api/"  # Adjust to point to the backend service
        ports:
        - containerPort: 5000  # Default port for Streamlit

---

apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: task-manager
spec:
  type: NodePort  # Expose the frontend on a NodePort
  ports:
  - port: 5000  # Expose on port 80
    targetPort: 5000  # Target port for Streamlit
    nodePort: 30001  # Optional: specify a node port
  selector:
    app: frontend