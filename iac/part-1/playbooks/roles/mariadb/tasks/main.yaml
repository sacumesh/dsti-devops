# -----------------------------
# Install required dependencies
# -----------------------------
- name: Install apt dependencies
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes

# -----------------------------
# Configure Docker repository
# -----------------------------
- name: Add Docker GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker APT repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install Docker Engine and CLI
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

# -----------------------------
# Ensure Docker service is running
# -----------------------------
- name: Ensure Docker service is started and enabled
  service:
    name: docker
    state: started
    enabled: yes

# -----------------------------
# Docker group and user permissions
# -----------------------------
- name: Ensure docker group exists
  group:
    name: docker
    state: present

- name: Add users to docker group
  user:
    name: "{{ item }}"
    groups: docker
    append: yes
  loop: "{{ docker_users | default([ansible_user, 'vagrant']) }}"
  when: item is defined and item != ""
  become: yes

# -----------------------------
# Pull MariaDB Docker image
# -----------------------------
- name: Pull MariaDB Docker image
  community.docker.docker_image:
    name: mariadb
    tag: "{{ mariadb_version | default('10.6') }}"
    source: pull

# -----------------------------
# Run MariaDB Docker container
# -----------------------------
- name: Run MariaDB container
  community.docker.docker_container:
    name: "{{ mariadb_container_name | default('mariadb') }}"
    image: "mariadb:{{ mariadb_version | default('10.6') }}"
    state: started
    restart_policy: unless-stopped
    env:
      MARIADB_ROOT_PASSWORD: "{{ mariadb_root_password }}"
      MARIADB_DATABASE: "{{ database_name }}"
      MARIADB_USER: "{{ database_user }}"
      MARIADB_PASSWORD: "{{ database_password }}"
    published_ports:
      - "3306:{{ database_port | default(3306) }}"

# -----------------------------
# Wait for MariaDB to be ready
# -----------------------------
- name: Wait for MariaDB container to be ready
  wait_for:
    host: "{{ mariadb_host | default('127.0.0.1') }}"
    port: "{{ mariadb_port | default(3306) }}"
    timeout: "{{ wait_for_db_timeout | default(60) }}"
