- name: Ensure springboot user exists
  user:
    name: "{{ app_user }}"
    shell: /bin/bash
    create_home: yes

- name: Ensure application directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  loop:
    - "{{ app_home }}"
    - "/var/log/{{ app_user }}"

- name: Update apt cache and install dependencies
  apt:
    name: "{{ item }}"
    state: present
    update_cache: yes
  loop:
    - openjdk-17-jdk
    - maven
    - git

- name: Determine repo name from URL
  set_fact:
    repo_name: "{{ repo_url | basename | regex_replace('\\.git$', '') }}"

- name: Mark Git repository as safe
  command: git config --global --add safe.directory "{{ app_home }}/{{ repo_name }}"
  become: yes
  when: repo_url is defined

- name: Clone the repository
  git:
    repo: "{{ repo_url }}"
    dest: "{{ app_home }}/{{ repo_name }}"
    version: main
    force: yes
    update: yes
  become: yes

- name: Build Spring Boot project with Maven
  command: mvn clean package -DskipTests
  args:
    chdir: "{{ app_home }}/{{ repo_name }}"
  become: yes

- name: Detect built JAR automatically
  find:
    paths: "{{ app_home }}/{{ repo_name }}/target"
    patterns: "*.jar"
    recurse: no
  register: jar_files

- name: Fail if no JAR found
  fail:
    msg: "No JAR found in {{ app_home }}/{{ repo_name }}/target"
  when: jar_files.matched == 0

- name: Create symlink to standard name app.jar
  file:
    src: "{{ jar_files.files[0].path }}"
    dest: "{{ app_home }}/{{ repo_name }}/target/app.jar"
    state: link
    force: yes

- name: Set app_jar_path fact
  set_fact:
    app_jar_path: "{{ app_home }}/{{ repo_name }}/target/app.jar"

- name: Wait for MariaDB Docker container to be ready
  wait_for:
    host: "{{ database_host }}"
    port: "{{ database_port }}"
    timeout: 60

- name: Create systemd service for Spring Boot application
  copy:
    dest: "/etc/systemd/system/{{ app_name }}.service"
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Spring Boot Task Manager Service
      After=network.target
      Wants=docker.service

      [Service]
      Type=simple
      User={{ app_user }}
      Group={{ app_group }}
      WorkingDirectory={{ app_home }}/{{ repo_name }}
      Environment="SERVER_PORT={{ manager_port }}"
      Environment="SERVER_ADDRESS=0.0.0.0"
      Environment="DATABASE_HOST={{ database_host }}"
      Environment="DATABASE_PORT={{ database_port }}"
      Environment="DATABASE_NAME={{ database_name }}"
      Environment="DATABASE_USER={{ database_user }}"
      Environment="DATABASE_PASSWORD={{ database_password }}"
      ExecStart=/usr/bin/java -jar {{ app_jar_path }}
      Restart=always
      RestartSec=10
      StandardOutput=syslog
      StandardError=syslog
      SyslogIdentifier={{ app_name }}

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes

- name: Enable and start Spring Boot service
  systemd:
    name: "{{ app_name }}"
    enabled: yes
    state: started
