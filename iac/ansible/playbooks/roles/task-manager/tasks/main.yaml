# -----------------------------
# Ensure the application user exists
# -----------------------------
- name: Ensure springboot user exists
  user:
    name: "{{ app_user }}"
    shell: /bin/bash
    create_home: yes

- name: Ensure application directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  loop:
    - "{{ app_home }}"
    - "/var/log/{{ app_user }}"

# -----------------------------
# Install system dependencies (root)
# -----------------------------
- name: Install required packages
  apt:
    name:
      - openjdk-17-jdk
      - maven
      - git
    state: present
    update_cache: yes

# -----------------------------
# Build Stage (run as root)
# -----------------------------
- name: Determine repo name from URL
  set_fact:
    repo_name: "{{ repo_url | basename | regex_replace('\\.git$', '') }}"

- name: Clone the repository (root)
  git:
    repo: "{{ repo_url }}"
    dest: "{{ app_home }}/{{ repo_name }}"
    version: main
    force: yes
    update: yes
  become: yes

- name: Build Spring Boot project (root)
  command: mvn clean package -DskipTests
  args:
    chdir: "{{ app_home }}/{{ repo_name }}"
  become: yes

- name: Detect built JAR automatically (root)
  find:
    paths: "{{ app_home }}/{{ repo_name }}/target"
    patterns: "*.jar"
    recurse: no
  register: jar_files

- name: Fail if no JAR found
  fail:
    msg: "No JAR found in {{ app_home }}/{{ repo_name }}/target"
  when: jar_files.matched == 0

- name: Create symlink to standard name app.jar (root)
  file:
    src: "{{ jar_files.files[0].path }}"
    dest: "{{ app_home }}/{{ repo_name }}/target/app.jar"
    state: link
    force: yes
  become: yes

- name: Set app_jar_path fact
  set_fact:
    app_jar_path: "{{ app_home }}/{{ repo_name }}/target/app.jar"

# -----------------------------
# Health-check wrapper script
# -----------------------------
- name: Copy health-check wrapper script
  copy:
    dest: "{{ app_home }}/{{ repo_name }}/start.sh"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
    content: |
      #!/bin/bash
      APP_JAR="{{ app_jar_path }}"
      HEALTH_URL="http://127.0.0.1:{{ task_manager_port }}/actuator/health"

      java -jar "$APP_JAR" &
      APP_PID=$!

      echo "Waiting for /actuator/health endpoint..."
      for i in {1..60}; do
          if curl -sf "$HEALTH_URL" > /dev/null; then
              echo "Application is healthy"
              systemd-notify --ready
              break
          fi
          sleep 4
      done

      if ! kill -0 $APP_PID 2>/dev/null; then
          echo "Application exited prematurely"
          exit 1
      fi

      wait $APP_PID

# -----------------------------
# Create systemd service
# -----------------------------
- name: Create systemd service for Spring Boot
  copy:
    dest: "/etc/systemd/system/{{ app_name }}.service"
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Spring Boot Task Manager Service
      After=network.target docker.service
      Wants=docker.service

      [Service]
      Type=notify
      User={{ app_user }}
      Group={{ app_group }}
      WorkingDirectory={{ app_home }}/{{ repo_name }}
      Environment="SERVER_PORT={{ task_manager_port }}"
      Environment="DATABASE_HOST={{ database_host }}"
      Environment="DATABASE_PORT={{ database_port }}"
      Environment="DATABASE_NAME={{ database_name }}"
      Environment="DATABASE_USER={{ database_user }}"
      Environment="DATABASE_PASSWORD={{ database_password }}"
      ExecStart={{ app_home }}/{{ repo_name }}/start.sh
      Restart=always
      RestartSec=10
      NotifyAccess=all
      StandardOutput=syslog
      StandardError=syslog
      SyslogIdentifier={{ app_name }}

      [Install]
      WantedBy=multi-user.target

# -----------------------------
# Reload systemd and start service
# -----------------------------
- name: Reload systemd daemon
  systemd:
    daemon_reload: yes

- name: Enable and start Spring Boot service
  systemd:
    name: "{{ app_name }}"
    enabled: yes
    state: started
