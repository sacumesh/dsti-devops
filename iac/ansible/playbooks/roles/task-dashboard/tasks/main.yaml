# -----------------------------
# Ensure the application user exists
# -----------------------------
- name: Ensure python app user exists
  user:
    name: "{{ app_user }}"
    shell: /bin/bash
    create_home: yes

- name: Ensure application directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  loop:
    - "{{ app_home }}"
    - "/var/log/{{ app_user }}"

# -----------------------------
# Install system dependencies
# -----------------------------
- name: Update apt cache and install dependencies
  apt:
    name: "{{ item }}"
    state: present
    update_cache: yes
  loop:
    - wget
    - bzip2
    - git
    - build-essential
    - curl

# -----------------------------
# Install Miniconda (if not already installed)
# -----------------------------
- name: Download Miniconda installer
  get_url:
    url: https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
    dest: /tmp/miniconda.sh
    mode: '0755'

- name: Install Miniconda as root
  command: bash /tmp/miniconda.sh -b -p "{{ conda_path }}"
  args:
    creates: "{{ conda_path }}/bin/conda"
  become: yes
  become_user: root

- name: Fix ownership of Miniconda directory
  file:
    path: "{{ conda_path }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    recurse: yes


# -----------------------------
# Clone repository
# -----------------------------
- name: Determine repo name from URL
  set_fact:
    repo_name: "{{ repo_url | basename | regex_replace('\\.git$', '') }}"

- name: Mark Git repository as safe
  command: git config --global --add safe.directory "{{ app_home }}/{{ repo_name }}"
  become: yes
  when: repo_url is defined

- name: Clone the repository
  git:
    repo: "{{ repo_url }}"
    dest: "{{ app_home }}/{{ repo_name }}"
    version: main
    force: yes
    update: yes
  become: yes

# -----------------------------
# Create Conda environment as root
# -----------------------------
- name: Accept Conda ToS for main channel
  command: "{{ conda_path }}/bin/conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main"
  become: yes

- name: Accept Conda ToS for R channel
  command: "{{ conda_path }}/bin/conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r"
  become: yes


- name: Create Conda environment for the app (as root)
  command: "{{ conda_path }}/bin/conda create -y -p {{ app_home }}/{{ repo_name }}/conda_env python={{ python_version }}"
  args:
    creates: "{{ app_home }}/{{ repo_name }}/conda_env"
  become: yes

- name: Install Python dependencies in Conda environment (as root)
  command: "{{ conda_path }}/bin/conda run -p {{ app_home }}/{{ repo_name }}/conda_env pip install -r {{ app_home }}/{{ repo_name }}/requirements.txt"
  become: yes

# -----------------------------
# Fix ownership of Conda environment
# -----------------------------
- name: Set ownership of Conda environment to app user
  file:
    path: "{{ app_home }}/{{ repo_name }}/conda_env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    recurse: yes


# -----------------------------
# Create systemd service for Python app
# -----------------------------
- name: Create systemd service for Python frontend
  copy:
    dest: "/etc/systemd/system/{{ app_name }}.service"
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Python Frontend Dashboard Service
      After=network.target docker.service
      Wants=docker.service

      [Service]
      Type=simple
      User={{ app_user }}
      Group={{ app_group }}
      WorkingDirectory={{ app_home }}/{{ repo_name }}
      Environment="SERVER_PORT={{ server_port }}"
      Environment="MANAGER_PORT={{ manager_port }}"
      Environment="MANAGER_HOST={{ manager_host }}"
      Environment="DATABASE_PASSWORD={{ database_password }}"
      ExecStart={{ conda_path }}/bin/conda run -p {{ app_home }}/{{ repo_name }}/conda_env python src/main.py
      Restart=always
      RestartSec=10
      StandardOutput=syslog
      StandardError=syslog
      SyslogIdentifier={{ app_name }}

      [Install]
      WantedBy=multi-user.target

# -----------------------------
# Reload systemd and start service
# -----------------------------
- name: Reload systemd daemon
  systemd:
    daemon_reload: yes

- name: Enable and start Python frontend service
  systemd:
    name: "{{ app_name }}"
    enabled: yes
    state: started
