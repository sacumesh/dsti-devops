---
# -----------------------------
# Install required dependencies
# -----------------------------
- name: Install apt dependencies
  become: true
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true
    cache_valid_time: 3600

# -----------------------------
# Configure Docker repository
# -----------------------------
- name: Add Docker GPG key
  become: true
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker APT repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
    update_cache: true

- name: Install Docker Engine and CLI
  become: true
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

# -----------------------------
# Ensure Docker service is running
# -----------------------------
- name: Ensure Docker service is started and enabled
  become: true
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
    daemon_reload: true

# -----------------------------
# Docker group and user permissions
# -----------------------------
- name: Ensure docker group exists
  become: true
  ansible.builtin.group:
    name: docker
    state: present

- name: Add users to docker group
  become: true
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ anisible_user| default([ansible_env.USER]) }}"
  when: item | length > 0

# -----------------------------
# Pull MariaDB Docker image
# -----------------------------
- name: Pull MariaDB Docker image
  become: true
  community.docker.docker_image:
    name: mariadb
    tag: "{{ mariadb_version }}"
    source: pull
    state: present

# -----------------------------
# Run MariaDB Docker container
# -----------------------------
- name: Run MariaDB container
  become: true
  community.docker.docker_container:
    name: "{{ mariadb_container_name }}"
    image: "mariadb:{{ mariadb_version }}"
    state: started
    restart_policy: unless-stopped
    env:
      MARIADB_ROOT_PASSWORD: "{{ mariadb_root_password }}"
      MARIADB_DATABASE: "{{ database_name }}"
      MARIADB_USER: "{{ database_user }}"
      MARIADB_PASSWORD: "{{ database_password }}"
    ports:
      - "{{ database_port }}:3306"
    volumes:
      - "{{ mariadb_data_dir }}:/var/lib/mysql"

# -----------------------------
# Wait for MariaDB to be ready
# -----------------------------
- name: Wait for MariaDB container to be ready
  ansible.builtin.wait_for:
    host: "{{ database_host }}"
    port: "{{ database_port }}"
    timeout: 60
    delay: 5
