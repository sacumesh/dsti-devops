---

- name: Update apt cache
  apt:
    update_cache: yes

- name: Install base dependencies
  apt:
    name:
      - curl
      - apt-transport-https
      - ca-certificates
      - conntrack
      - socat
      - gnupg
      - lsb-release
      - software-properties-common
    state: present

- name: Download Minikube binary
  get_url:
    url: "{{ minikube_download_url }}"
    dest: /tmp/minikube
    mode: "0755"

- name: Install Minikube
  copy:
    src: /tmp/minikube
    dest: "{{ minikube_bin_path }}"
    mode: "0755"

- name: Remove Minikube temp binary
  file:
    path: /tmp/minikube
    state: absent

- name: Start Minikube as non-root user
  become: true
  become_user: "{{ k8s_user }}"
  shell: >
    newgrp docker
    minikube start
    --driver={{ minikube_driver }}
    --memory={{ minikube_memory }}
    --cpus={{ minikube_cpus }}

- name: Create systemd service for Minikube
  become: true
  template:
    src: minikube.service.j2
    dest: /etc/systemd/system/minikube.service
    mode: "0644"
  notify:
    - reload systemd

