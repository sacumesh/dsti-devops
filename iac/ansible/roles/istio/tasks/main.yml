---
- name: Install required dependencies
  apt:
    name:
      - curl
    state: present
    update_cache: yes
  become: yes

- name: Download Istio installer script
  get_url:
    url: https://istio.io/downloadIstio
    dest: "{{ istio_download_script }}"
    mode: "0755"

- name: Run Istio download script
  shell: ISTIO_VERSION={{ istio_version }} {{ istio_download_script }}
  args:
    chdir: "{{ istio_base_dir }}"

- name: Locate Istio directory
  shell: ls -d istio-{{ istio_version }}
  args:
    chdir: "{{ istio_base_dir }}"
  register: istio_dir
  changed_when: false

- name: Save Istio directory path
  set_fact:
    istio_install_path: "{{ istio_base_dir }}/{{ istio_dir.stdout }}"

- name: Add istioctl binary to PATH
  copy:
    dest: /etc/profile.d/istio.sh
    mode: "0755"
    content: |
      export PATH={{ istio_install_path }}/bin:$PATH

- name: Install Istio (demo profile, no gateways)
  shell: |
    . /etc/profile.d/istio.sh
    istioctl install -f {{ istio_install_path }}/samples/bookinfo/demo-profile-no-gateways.yaml -y
  args:
    executable: /bin/bash
  become: yes

- name: Enable automatic sidecar injection
  shell: kubectl label namespace default istio-injection=enabled --overwrite
  become: yes
