---

- name: Install Nginx
  apt:
    name: "{{ nginx_package_name }}"
    state: present
    update_cache: yes

- name: Create Nginx sites-enabled directory (if not present)
  file:
    path: /etc/nginx/sites-enabled
    state: directory

- name: Deploy reverse proxy config
  template:
    src: proxy.conf.j2
    dest: /etc/nginx/sites-enabled/reverse-proxy.conf
  notify: restart nginx

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: restart nginx

- name: Ensure Nginx is enabled and running
  service:
    name: "{{ nginx_service_name }}"
    enabled: yes
    state: started

- name: Verify Nginx installation
  shell: nginx -v
  register: nginx_version_output
  ignore_errors: yes

- debug:
    var: nginx_version_output.stdout_lines